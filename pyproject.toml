[project]
name = "parallel-rag"
version = "0.1.0"
description = "Distributed RAG system with git-based parallel execution"
requires-python = ">=3.8"
dependencies = [
    "exo-explore",
    "gitpython",
    "z3-solver",
    "numpy",
    "torch",
    "pydantic",
    "fastapi",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]
exclude = ["tests*"]

